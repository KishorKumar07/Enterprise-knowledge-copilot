global:
  scrape_interval: 10s

scrape_configs:
  - job_name: "ekc-backend"
    metrics_path: /metrics
    static_configs:
      # The backend is a container on the same compose network, so scrape it by
      # service name on its own port (7860 — see backend/Dockerfile).
      #
      # This used to be host.docker.internal:8000, which only worked when the
      # backend ran on the host under `uvicorn --reload` on Docker Desktop.
      # On Linux (i.e. the EC2 box) that name doesn't resolve and the port was
      # wrong anyway, so every Grafana panel showed "No data".
      - targets: ["backend:7860"]
