services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ekc_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ekc
      POSTGRES_PASSWORD: ekc_dev_password
      POSTGRES_DB: enterprise_knowledge_copilot
    ports:
      - "5432:5432"
    volumes:
      - ekc_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ekc -d enterprise_knowledge_copilot"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- agent_ops stack: all free, self-hosted, no accounts required ---

  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: ekc_phoenix
    restart: unless-stopped
    ports:
      - "6006:6006" # UI + OTLP/HTTP trace ingest (/v1/traces)
      - "4317:4317" # OTLP/gRPC trace ingest
    volumes:
      - ekc_phoenix_data:/mnt/data

  prometheus:
    image: prom/prometheus:latest
    container_name: ekc_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ekc_prometheus_data:/prometheus

  grafana:
    image: grafana/grafana-oss:latest
    container_name: ekc_grafana
    restart: unless-stopped
    ports:
      - "3001:3000" # frontend already uses 3000
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ekc_grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  ekc_postgres_data:
  ekc_phoenix_data:
  ekc_prometheus_data:
  ekc_grafana_data:
