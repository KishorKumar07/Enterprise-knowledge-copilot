services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ekc_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ekc
      POSTGRES_PASSWORD: ekc_dev_password
      POSTGRES_DB: enterprise_knowledge_copilot
    ports:
      - "5432:5432"
    volumes:
      - ekc_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ekc -d enterprise_knowledge_copilot"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- application services ---

  backend:
    build:
      context: ./backend
    container_name: ekc_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.docker
    environment:
      # Container-to-container, so these point at service names rather than
      # localhost. .env.docker's own copies are for host-side `uvicorn --reload`.
      DATABASE_URL: postgresql+asyncpg://ekc:ekc_dev_password@postgres:5432/enterprise_knowledge_copilot
      PHOENIX_ENDPOINT: http://phoenix:6006
    ports:
      - "7860:7860"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # NEXT_PUBLIC_* is compiled into the client bundle at build time, so it
        # has to be a build arg — a runtime env var would leave the default
        # baked in and every browser call would hit the wrong host.
        NEXT_PUBLIC_API_URL: http://localhost:7860
        NEXT_PUBLIC_GRAFANA_URL: http://localhost:3001
        NEXT_PUBLIC_PHOENIX_URL: http://localhost:6006
    container_name: ekc_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

  # --- agent_ops stack: all free, self-hosted, no accounts required ---

  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: ekc_phoenix
    restart: unless-stopped
    ports:
      - "6006:6006" # UI + OTLP/HTTP trace ingest (/v1/traces)
      - "4317:4317" # OTLP/gRPC trace ingest
    volumes:
      - ekc_phoenix_data:/mnt/data

  prometheus:
    image: prom/prometheus:latest
    container_name: ekc_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ekc_prometheus_data:/prometheus

  grafana:
    image: grafana/grafana-oss:latest
    container_name: ekc_grafana
    restart: unless-stopped
    ports:
      - "3001:3000" # frontend already uses 3000
    environment:
      # Anonymous admin was fine when this only ever listened on localhost, but
      # the same compose file now also describes a public server — anyone who
      # found the URL would get full admin. Password auth instead, overridable
      # from the environment so production can set a real one.
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ekc_grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  ekc_postgres_data:
  ekc_phoenix_data:
  ekc_prometheus_data:
  ekc_grafana_data:
