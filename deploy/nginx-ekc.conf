# Nginx site for the Enterprise Knowledge Copilot (installed at
# /etc/nginx/conf.d/ekc.conf on the EC2 host). Written for plain HTTP on :80;
# run `sudo certbot --nginx -d <hostname>` afterwards and certbot adds the
# :443 server block, the certificate and the HTTP->HTTPS redirect.
#
# System Design Studio has its own conf.d file and its own hostname; this file
# never touches it.

server {
    listen 80;
    server_name kishor-ekc.duckdns.org;

    client_max_body_size 25m;

    # Chat streams the answer token by token and a RAG turn can take a while.
    # Nginx's 60s default read timeout would cut answers off.
    proxy_read_timeout 300s;
    proxy_connect_timeout 75s;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
        proxy_pass http://127.0.0.1:7860;
        # Server-sent events: without this the whole answer arrives in one lump.
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Grafana has its own login (GF_SECURITY_ADMIN_PASSWORD).
    location /grafana/ {
        proxy_pass http://127.0.0.1:3001;
    }

    # Phoenix has NO auth of its own and stores prompts plus retrieved document
    # text, so it sits behind HTTP basic auth.
    # Create the file once on the server:
    #   sudo htpasswd -c /etc/nginx/.htpasswd-ekc <user>
    location /phoenix/ {
        auth_basic "Phoenix traces";
        auth_basic_user_file /etc/nginx/.htpasswd-ekc;
        proxy_pass http://127.0.0.1:6006;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
