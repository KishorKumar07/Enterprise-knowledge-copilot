name: RAG quality eval

# LLM-as-judge faithfulness/relevancy checks. Nondeterministic and spends
# Gemini/Groq quota, so it is deliberately NOT part of the per-push gate:
# run it by hand, or read the weekly trend.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 0" # Sundays 02:00 UTC

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      OTEL_ENABLED: "false"
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/eval -v
