name: Deploy

# push to main -> CI must pass -> build images on GitHub's runners -> push to ECR
# (tagged with the git SHA) -> tell the server to roll out that SHA -> verify.
#
# No AWS keys exist anywhere: GitHub proves who it is to AWS with a short-lived
# OIDC token, and AWS hands back temporary credentials for one run.
#
# Repository VARIABLES (Settings > Secrets and variables > Actions > Variables),
# deliberately not hardcoded here because this repo is public:
#   AWS_ROLE_ARN       role GitHub assumes (github-actions-ekc)
#   APP_INSTANCE_ID    EC2 instance id of apps-prod
#   DEPLOY_ENABLED     "true" once the server is prepared; until then only the
#                      build + push to ECR runs and the deploy stages are skipped
#
# While the server is stopped to save credits, set DEPLOY_ENABLED to "false" (or
# delete it): otherwise the deploy job fails because nothing answers over SSM.
# Set it back to "true" after starting the server.
on:
  push:
    branches: [main]
    # Documentation-only pushes don't change what runs, so don't rebuild 2 GB
    # of images or touch the server for them.
    paths-ignore:
      - "**.md"
  workflow_dispatch:

# Two deploys racing one database is a bad afternoon. Queue, never cancel.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  id-token: write # required for OIDC; without it the AWS login fails confusingly
  contents: read

env:
  AWS_REGION: ap-south-1
  PUBLIC_URL: https://kishor-ekc.duckdns.org

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  build:
    name: Build & push (${{ matrix.image }})
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: true
      matrix:
        image: [backend, frontend]
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: vars
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image }}
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/ekc-${{ matrix.image }}:${{ steps.vars.outputs.tag }}
            ${{ steps.ecr.outputs.registry }}/ekc-${{ matrix.image }}:latest
          # NEXT_PUBLIC_* is compiled into the browser bundle, so it must be a
          # build arg. Ignored by the backend Dockerfile (no matching ARG).
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.PUBLIC_URL }}
            NEXT_PUBLIC_GRAFANA_URL=${{ env.PUBLIC_URL }}/grafana/
            NEXT_PUBLIC_PHOENIX_URL=${{ env.PUBLIC_URL }}/phoenix/
          # The runner is thrown away after every run, so without a remote cache
          # the 2 GB torch layer would be rebuilt from scratch each time.
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    name: Deploy to apps-prod
    needs: build
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Roll out the release through SSM
        env:
          INSTANCE_ID: ${{ vars.APP_INSTANCE_ID }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          REGISTRY="$(aws sts get-caller-identity --query Account --output text).dkr.ecr.${AWS_REGION}.amazonaws.com"

          # Check out the exact release SHA on the server, then run the script
          # that ships in that same commit.
          REMOTE="set -e; cd /opt/apps/ekc/repo && git fetch --depth 1 origin ${GITHUB_SHA} && git checkout -qf FETCH_HEAD && bash deploy/remote-deploy.sh ${TAG} ${REGISTRY}"

          COMMAND_ID="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${TAG}" \
            --parameters "$(jq -nc --arg c "$REMOTE" '{commands: [$c], executionTimeout: ["1500"]}')" \
            --query Command.CommandId --output text)"
          echo "SSM command: $COMMAND_ID"

          # `aws ssm wait` gives up after ~100 s, shorter than pulling a 2 GB image.
          STATUS=Pending
          for _ in $(seq 1 180); do
            sleep 10
            STATUS="$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)"
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
          done

          echo "::group::Server output"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text
          echo "::endgroup::"

          echo "Final status: $STATUS"
          [ "$STATUS" = "Success" ]

  verify:
    name: Verify the public site
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for HTTPS health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "${PUBLIC_URL}/api/health" >/dev/null; then echo "healthy"; exit 0; fi
            echo "attempt $i: not yet"; sleep 10
          done
          echo "site did not become healthy at ${PUBLIC_URL}" >&2
          exit 1
